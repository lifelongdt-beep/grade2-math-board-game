<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <meta name="theme-color" content="#0f6f70" />
    <!-- 첫 화면 제목·숫자 단추에 쓰는 둥근 글꼴(Jua)입니다. 인터넷이 없으면 기본 글꼴로 보입니다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" />
    <title>보조개샘ai클래스 수학 게임</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (window.location.protocol === 'file:') {
        document.body.innerHTML =
          '<main style="font-family: Malgun Gothic, sans-serif; padding: 40px; line-height: 1.6">' +
          '<h1>보조개샘ai클래스 수학 게임을 여는 중입니다</h1>' +
          '<p>이 앱은 개발 서버에서 실행됩니다. 잠시 뒤 자동으로 이동합니다.</p>' +
          '<p>자동 이동이 되지 않으면 <a href="http://127.0.0.1:5173/">http://127.0.0.1:5173/</a>를 열어 주세요.</p>' +
          '</main>';
        window.setTimeout(function () {
          window.location.href = 'http://127.0.0.1:5173/';
        }, 500);
        window.stop();
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
